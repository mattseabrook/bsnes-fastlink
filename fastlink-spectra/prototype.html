<!DOCTYPE html>
<html lang="en">
<head>
    <title>snes9x-FastLink v.0.3</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0a0a0f; margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #contextMenu {
            display: none; position: absolute; z-index: 1000;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid #4a4a6a; border-radius: 8px;
            padding: 4px 0; margin: 0; list-style: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            min-width: 160px;
        }
        #contextMenu li {
            cursor: pointer; padding: 8px 16px; position: relative;
            color: #e0e0ff; transition: background 0.15s;
        }
        #contextMenu li:hover { background: rgba(100, 100, 200, 0.3); }
        #contextMenu ul {
            display: none; position: absolute; left: 100%; top: -4px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid #4a4a6a; border-radius: 8px;
            padding: 4px 0; margin: 0; list-style: none; white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        #contextMenu li:hover > ul { display: block; }
        #hud {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            color: #8888ff; font-size: 12px; font-family: monospace;
            text-shadow: 0 0 10px rgba(100,100,255,0.5);
            pointer-events: none;
        }
        #stats {
            position: fixed; bottom: 10px; right: 10px; z-index: 100;
            color: #666; font-size: 11px; font-family: monospace;
            text-align: right; pointer-events: none;
        }
        .legend {
            position: fixed; bottom: 10px; left: 10px; z-index: 100;
            display: flex; gap: 12px; font-size: 10px; font-family: monospace;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; color: #888; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">SNES9X-FastLink v0.3<br><span id="viewLabel">WRAM 128KB</span></div>
    <div id="stats">
        <div>Changes: <span id="changeCount">0</span>/frame</div>
        <div>Hotspots: <span id="hotspotCount">0</span></div>
    </div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#6366f1"></div>Zero Page</div>
        <div class="legend-item"><div class="legend-color" style="background:#22d3ee"></div>Stack</div>
        <div class="legend-item"><div class="legend-color" style="background:#a855f7"></div>Game State</div>
        <div class="legend-item"><div class="legend-color" style="background:#f472b6"></div>Buffers</div>
        <div class="legend-item"><div class="legend-color" style="background:#fbbf24"></div>⚡ Changed</div>
    </div>
    <ul id="contextMenu">
        <li>View &#x25B8;<ul id="viewMenu"></ul></li>
        <li>Effects &#x25B8;<ul id="effectMenu"></ul></li>
        <li>Color Mode &#x25B8;<ul id="colorMenu"></ul></li>
    </ul>
    <script>
    (function() {
        'use strict';

        const RAM_URL = 'http://127.0.0.1:9000/';
        const POLL_MS = 100;
        const BACKGROUND = 0xFF0a0a0f;
        const AGE_DECAY = 38;
        const HEAT_GAIN = 26;
        const HOTSPOT_THRESHOLD = 77;
        const MAX_PARTICLES = 500;
        const MEM_SIZES = { wram: 131072, vram: 65536, sram: 32768 };
        const REGION_HUES = [230, 190, 280, 320, 45, 160];
        const PARTICLE_COLORS = REGION_HUES.map(hue => `hsl(${hue}, 80%, 70%)`);

        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl2', {
            alpha: false, antialias: false, depth: false, stencil: false,
            powerPreference: 'high-performance', failIfMajorPerformanceCaveat: true
        });
        if (!gl) throw new Error('Spectra requires accelerated WebGL2.');
        // Keep the browser's original shadow blur and text rasterization.
        const effectsCanvas = document.createElement('canvas');
        effectsCanvas.style.cssText = 'position:fixed;inset:0;pointer-events:none';
        canvas.after(effectsCanvas);
        const ctx = effectsCanvas.getContext('2d');
        const menu = document.getElementById('contextMenu');
        const viewLabel = document.getElementById('viewLabel');
        const changeCount = document.getElementById('changeCount');
        const hotspotCount = document.getElementById('hotspotCount');

        let savedState = {};
        try { savedState = JSON.parse(localStorage.getItem('fastlink_state2') || '{}'); } catch (_) {}
        const state = { colorMode: 0, effectMode: 1, view: 0, ...savedState };
        const saveState = () => localStorage.setItem('fastlink_state2', JSON.stringify(state));

        const unit = new Float32Array(256);
        for (let i = 0; i < 256; i++) unit[i] = i / 255;

        let currentSize = MEM_SIZES.wram;
        let currentBuffer = new Uint8Array(currentSize);
        let previousBuffer = new Uint8Array(currentSize);
        let demoBuffer = new Uint8Array(currentSize);
        let changeAge = new Uint8Array(currentSize);
        let heatmap = new Uint8Array(currentSize);
        let regionBand = new Uint8Array(currentSize);
        let colorCache = new Uint32Array(0);
        let frameColors = new Uint32Array(currentSize);
        let colorsDirty = true;
        let program, vao, rectBuffer, colorBuffer, ageBuffer, offsetBuffer;
        let rasterFramebuffer, rasterTexture, viewportUniform, effectUniform;
        let waveOffsets = new Int32Array(currentSize * 2);
        let uploadDirty = true;
        let frameCount = 0;
        let needsDraw = true;
        let rasterDirty = true;
        let renderQueued = false;
        let resizeQueued = false;
        let lastChanges = '';
        let lastHotspots = '';

        let tileLayout;

        const particles = Array.from({ length: MAX_PARTICLES }, () => ({
            x: 0, y: 0, vx: 0, vy: 0, life: 0, decay: 0, size: 0, gravity: 0.15, color: '#fff'
        }));
        let particleCount = 0;

        function initializeGL() {
            program = gl.createProgram();
            const sources = [
                [gl.VERTEX_SHADER, `#version 300 es
                    precision highp float;
                    precision highp int;
                    layout(location=0) in ivec4 rect;
                    layout(location=1) in uint color;
                    layout(location=2) in uint age;
                    layout(location=3) in ivec2 waveOffset;
                    uniform vec2 viewport;
                    uniform int effect;
                    flat out vec4 tileColor;
                    void main() {
                        ivec2 corner = ivec2(gl_VertexID & 1, gl_VertexID >> 1);
                        int glow = effect == 1 && age > 127u ? 1 : 0;
                        ivec2 pixel = rect.xy - ivec2(glow)
                            + corner * (rect.zw + ivec2(glow * 2));
                        if (effect == 3) pixel += waveOffset;
                        vec2 position = vec2(pixel) / viewport * 2.0 - 1.0;
                        gl_Position = color == 0xFF0a0a0fu ? vec4(2, 2, 0, 1)
                            : vec4(position.x, -position.y, 0, 1);
                        tileColor = vec4(float(color & 255u), float((color >> 8) & 255u),
                            float((color >> 16) & 255u), 255.0) / 255.0;
                    }`],
                [gl.FRAGMENT_SHADER, `#version 300 es
                    precision highp float;
                    flat in vec4 tileColor;
                    out vec4 color;
                    void main() { color = tileColor; }`]
            ];
            for (const [type, source] of sources) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                gl.attachShader(program, shader);
                gl.deleteShader(shader);
            }
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS))
                throw new Error(gl.getProgramInfoLog(program));
            gl.useProgram(program);
            viewportUniform = gl.getUniformLocation(program, 'viewport');
            effectUniform = gl.getUniformLocation(program, 'effect');
            vao = gl.createVertexArray();
            gl.bindVertexArray(vao);
            const buffers = [];
            for (const [index, size, type] of [[0, 4, gl.INT], [1, 1, gl.UNSIGNED_INT],
                [2, 1, gl.UNSIGNED_BYTE], [3, 2, gl.INT]]) {
                const buffer = gl.createBuffer();
                buffers.push(buffer);
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.enableVertexAttribArray(index);
                gl.vertexAttribIPointer(index, size, type, 0, 0);
                gl.vertexAttribDivisor(index, 1);
            }
            [rectBuffer, colorBuffer, ageBuffer, offsetBuffer] = buffers;
            rasterFramebuffer = gl.createFramebuffer();
            rasterTexture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, rasterTexture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.disable(gl.DITHER);
            gl.clearColor(15 / 255, 10 / 255, 10 / 255, 1);
        }

        canvas.addEventListener('webglcontextlost', event => event.preventDefault());
        canvas.addEventListener('webglcontextrestored', () => {
            initializeGL();
            resize(true);
        });
        initializeGL();

        function requestDraw(raster = true) {
            needsDraw = true;
            if (raster) rasterDirty = true;
            if (!renderQueued && !document.hidden && !gl.isContextLost()) {
                renderQueued = true;
                requestAnimationFrame(render);
            }
        }

        function regionForAddress(address) {
            if (address < 0x100) return 0;
            if (address < 0x200) return 1;
            if (address < 0x2000) return 2;
            if (address < 0x4000) return 3;
            if (address < 0x8000) return 4;
            return 5;
        }

        function rebuildRegionBands() {
            for (let i = 0; i < currentSize; i++) regionBand[i] = regionForAddress(i);
        }

        function hsl2rgb32(h, s, l, boost = 0) {
            h = ((h % 360) + 360) % 360;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
            const m = l - c / 2;
            let r, g, b;
            if (h < 60)       { r = c; g = x; b = 0; }
            else if (h < 120) { r = x; g = c; b = 0; }
            else if (h < 180) { r = 0; g = c; b = x; }
            else if (h < 240) { r = 0; g = x; b = c; }
            else if (h < 300) { r = x; g = 0; b = c; }
            else              { r = c; g = 0; b = x; }
            r = Math.min(255, ((r + m) * 255 + boost) | 0);
            g = Math.min(255, ((g + m) * 255 + boost) | 0);
            b = Math.min(255, ((b + m) * 255 + boost) | 0);
            return 0xFF000000 | (b << 16) | (g << 8) | r;
        }

        function baseColor(value, hue, saturation = 0.8) {
            if (value === 0) return BACKGROUND;
            return hsl2rgb32(hue, saturation, 0.15 + (value / 255) * 0.45);
        }

        function rebuildColorCache() {
            colorsDirty = true;
            if (state.colorMode === 0) {
                colorCache = new Uint32Array(REGION_HUES.length * 256);
                for (let band = 0; band < REGION_HUES.length; band++) {
                    for (let value = 0; value < 256; value++) {
                        colorCache[(band << 8) | value] = baseColor(value, REGION_HUES[band]);
                    }
                }
            } else if (state.colorMode === 2) {
                colorCache = new Uint32Array(256 * 256);
                for (let heat = 0; heat < 256; heat++) {
                    const hue = 240 - unit[heat] * 180;
                    for (let value = 0; value < 256; value++) {
                        colorCache[(heat << 8) | value] = baseColor(value, hue, 0.9);
                    }
                }
            } else {
                colorCache = new Uint32Array(256);
                for (let value = 0; value < 256; value++) {
                    colorCache[value] = baseColor(value, state.colorMode === 1 ? 280 : (value / 255) * 300);
                }
            }
        }

        function getColor(value, address, age, heat) {
            if (value === 0 && age <= 0) return BACKGROUND;
            if (age <= 0) {
                if (state.colorMode === 0) return colorCache[(regionBand[address] << 8) | value];
                if (state.colorMode === 2) return colorCache[((heat * 255) | 0) << 8 | value];
                return colorCache[value];
            }

            let h, s = 0.8, l = 0.15 + (value / 255) * 0.45;

            switch (state.colorMode) {
                case 0:
                    h = REGION_HUES[regionBand[address]];
                    break;
                case 1:
                    h = 280;
                    break;
                case 2:
                    h = 240 - heat * 180;
                    s = 0.9;
                    break;
                case 3:
                    h = (value / 255) * 300;
                    break;
            }

            const f = age * age;
            l = Math.min(0.9, l + f * 0.5);
            s = Math.max(0.3, s - f * 0.3);
            h = h + (60 - h) * f * 0.5;
            return hsl2rgb32(h, s, l, f * 150);
        }

        function resizeMemory(size, data = null) {
            currentSize = size;
            currentBuffer = data || new Uint8Array(size);
            previousBuffer = new Uint8Array(size);
            demoBuffer = new Uint8Array(size);
            changeAge = new Uint8Array(size);
            heatmap = new Uint8Array(size);
            regionBand = new Uint8Array(size);
            frameColors = new Uint32Array(size);
            colorsDirty = true;
            rebuildRegionBands();
            updateLayout();
            requestDraw();
        }

        function resize(force = false) {
            if (!force && tileLayout && canvas.width === window.innerWidth && canvas.height === window.innerHeight) return;
            canvas.width = effectsCanvas.width = window.innerWidth;
            canvas.height = effectsCanvas.height = window.innerHeight;
            gl.bindTexture(gl.TEXTURE_2D, rasterTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, Math.max(1, canvas.width),
                Math.max(1, canvas.height), 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
            gl.bindFramebuffer(gl.FRAMEBUFFER, rasterFramebuffer);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rasterTexture, 0);
            updateLayout();
            requestDraw();
        }

        function updateLayout() {
            const w = Math.max(1, canvas.width || window.innerWidth || 1);
            const h = Math.max(1, canvas.height || window.innerHeight || 1);
            const tilesX = Math.max(1, Math.round(Math.sqrt(currentSize * (w / h))));
            const tilesY = Math.max(1, Math.ceil(currentSize / tilesX));
            const colX = new Int32Array(tilesX);
            const colW = new Int32Array(tilesX);
            const rowY = new Int32Array(tilesY);
            const rowH = new Int32Array(tilesY);
            const drawColX = new Int32Array(tilesX);
            const drawColW = new Int32Array(tilesX);
            const drawRowY = new Int32Array(tilesY);
            const drawRowH = new Int32Array(tilesY);
            const tileW = w / tilesX, tileH = h / tilesY;

            for (let col = 0; col < tilesX; col++) {
                const x0 = (col * w / tilesX) | 0;
                const x1 = ((col + 1) * w / tilesX) | 0;
                colX[col] = x0;
                colW[col] = Math.max(1, x1 - x0);
                drawColX[col] = col * tileW | 0;
                drawColW[col] = ((col + 1) * tileW | 0) - drawColX[col];
            }
            for (let row = 0; row < tilesY; row++) {
                const y0 = (row * h / tilesY) | 0;
                const y1 = ((row + 1) * h / tilesY) | 0;
                rowY[row] = y0;
                rowH[row] = Math.max(1, y1 - y0);
                drawRowY[row] = row * tileH | 0;
                drawRowH[row] = ((row + 1) * tileH | 0) - drawRowY[row];
            }

            tileLayout = { tilesX, colX, colW, rowY, rowH };
            const rects = new Int32Array(currentSize * 4);
            for (let i = 0, col = 0, row = 0; i < currentSize; i++, col++) {
                if (col === tilesX) { col = 0; row++; }
                rects[i * 4] = drawColX[col];
                rects[i * 4 + 1] = drawRowY[row];
                rects[i * 4 + 2] = drawColW[col];
                rects[i * 4 + 3] = drawRowH[row];
            }
            waveOffsets = new Int32Array(currentSize * 2);
            for (const [buffer, data, usage] of [[rectBuffer, rects, gl.STATIC_DRAW],
                [colorBuffer, frameColors, gl.DYNAMIC_DRAW], [ageBuffer, changeAge, gl.DYNAMIC_DRAW],
                [offsetBuffer, waveOffsets, gl.DYNAMIC_DRAW]]) {
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.bufferData(gl.ARRAY_BUFFER, data, usage);
            }
            uploadDirty = true;
        }

        function spawnParticles(x, y, color, count = 3) {
            for (let i = 0; i < count && particleCount < MAX_PARTICLES; i++) {
                const p = particles[particleCount++];
                p.x = x;
                p.y = y;
                p.vx = (Math.random() - 0.5) * 3;
                p.vy = -Math.random() * 4 - 2;
                p.life = 1.0;
                p.decay = 0.02 + Math.random() * 0.03;
                p.size = 2 + Math.random() * 3;
                p.gravity = 0.15;
                p.color = color;
            }
        }

        function drawParticles() {
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            for (let i = particleCount - 1; i >= 0; i--) {
                const p = particles[i];
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    const dead = particles[i];
                    particles[i] = particles[--particleCount];
                    particles[particleCount] = dead;
                    continue;
                }

                const alpha = p.life * p.life;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = p.size * 2;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function processChanges(newData) {
            let changes = 0;
            let hotspots = 0;
            const particleMode = state.effectMode === 2;
            const { tilesX, colX, colW, rowY, rowH } = tileLayout;

            for (let i = 0; i < currentSize; i++) {
                const newValue = newData[i];
                const oldValue = previousBuffer[i];
                const oldAge = changeAge[i];
                const oldHeat = heatmap[i];

                if (newValue !== oldValue) {
                    changes++;
                    changeAge[i] = 255;
                    heatmap[i] = Math.min(255, heatmap[i] + HEAT_GAIN);

                    if (particleMode && particleCount < MAX_PARTICLES && Math.abs(newValue - oldValue) > 20) {
                        const col = i % tilesX;
                        const row = (i / tilesX) | 0;
                        spawnParticles(
                            colX[col] + colW[col] / 2,
                            rowY[row] + rowH[row] / 2,
                            PARTICLE_COLORS[regionBand[i]],
                            Math.min(5, Math.abs(newValue - oldValue) / 30 | 0)
                        );
                    }
                } else {
                    changeAge[i] = changeAge[i] > AGE_DECAY ? changeAge[i] - AGE_DECAY : 0;
                    if (heatmap[i] > 0) heatmap[i] = (heatmap[i] * 254) >> 8;
                }

                if (heatmap[i] > HOTSPOT_THRESHOLD) hotspots++;
                previousBuffer[i] = newValue;
                if (colorsDirty || newValue !== oldValue || oldAge !== changeAge[i]
                    || (state.colorMode === 2 && oldHeat !== heatmap[i]))
                    frameColors[i] = getColor(newValue, i, unit[changeAge[i]], unit[heatmap[i]]);
            }
            colorsDirty = false;
            uploadDirty = true;

            const changesText = changes.toLocaleString();
            const hotspotsText = hotspots.toLocaleString();
            if (changesText !== lastChanges) changeCount.textContent = lastChanges = changesText;
            if (hotspotsText !== lastHotspots) hotspotCount.textContent = lastHotspots = hotspotsText;
        }

        function acceptRAM(newData) {
            if (newData.length !== currentSize) {
                resizeMemory(newData.length, newData);
            } else {
                currentBuffer = newData;
            }
            processChanges(newData);
            requestDraw();
        }

        function demoFrame() {
            for (let i = 0; i < currentSize; i++) {
                demoBuffer[i] = Math.random() < 0.001 ? Math.random() * 256 | 0 : currentBuffer[i];
            }
            acceptRAM(demoBuffer);
        }

        function draw() {
            if (gl.isContextLost() || !canvas.width || !canvas.height) return;
            const w = canvas.width, h = canvas.height;
            if (rasterDirty || state.effectMode === 3) {
                if (colorsDirty) {
                    for (let i = 0; i < currentSize; i++)
                        frameColors[i] = getColor(currentBuffer[i], i, unit[changeAge[i]], unit[heatmap[i]]);
                    colorsDirty = false;
                    uploadDirty = true;
                }
                if (uploadDirty) {
                    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
                    gl.bufferSubData(gl.ARRAY_BUFFER, 0, frameColors);
                    gl.bindBuffer(gl.ARRAY_BUFFER, ageBuffer);
                    gl.bufferSubData(gl.ARRAY_BUFFER, 0, changeAge);
                    uploadDirty = false;
                }
                if (state.effectMode === 3) {
                    const time = frameCount * 0.05;
                    for (let i = 0; i < currentSize; i++) {
                        const age = unit[changeAge[i]];
                        // Preserve JavaScript's original trig and integer truncation.
                        if (age > 0) {
                            waveOffsets[i * 2] = Math.sin(time + i * 0.01) * age * 3 | 0;
                            waveOffsets[i * 2 + 1] = Math.cos(time + i * 0.01) * age * 2 | 0;
                        } else {
                            waveOffsets[i * 2] = waveOffsets[i * 2 + 1] = 0;
                        }
                    }
                    gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuffer);
                    gl.bufferSubData(gl.ARRAY_BUFFER, 0, waveOffsets);
                }
                gl.bindFramebuffer(gl.FRAMEBUFFER, rasterFramebuffer);
                gl.viewport(0, 0, w, h);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.uniform2f(viewportUniform, w, h);
                gl.uniform1i(effectUniform, state.effectMode);
                gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, currentSize);
                rasterDirty = false;
            }
            gl.bindFramebuffer(gl.READ_FRAMEBUFFER, rasterFramebuffer);
            gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
            gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
            ctx.clearRect(0, 0, w, h);
            if (state.effectMode === 2 && particleCount > 0) drawParticles();
            frameCount++;
            needsDraw = false;
        }

        function render() {
            renderQueued = false;
            if (document.hidden) return;
            if (needsDraw || (state.effectMode === 2 && particleCount > 0)) draw();
            if (state.effectMode === 2 && particleCount > 0) requestDraw(false);
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) requestDraw();
        });

        function startWorkerPolling() {
            const source = `
                const RAM_URL = ${JSON.stringify(RAM_URL)};
                const POLL_MS = ${POLL_MS};
                const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
                let active = true;
                let acknowledge = null;
                onmessage = event => {
                    if (typeof event.data.active === 'boolean') active = event.data.active;
                    if (event.data.ack && acknowledge) { acknowledge(); acknowledge = null; }
                };
                const deliver = (message, transfer = []) => new Promise(resolve => {
                    acknowledge = resolve;
                    postMessage(message, transfer);
                });
                async function poll() {
                    for (;;) {
                        if (!active) { await sleep(250); continue; }
                        const started = performance.now();
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 1000);
                        try {
                            const response = await fetch(RAM_URL, { cache: 'no-store', signal: controller.signal });
                            if (!response.ok) throw new Error('fetch failed');
                            const buffer = await response.arrayBuffer();
                            if (buffer.byteLength !== 131072) throw new Error('invalid WRAM size');
                            await deliver({ type: 'ram', buffer }, [buffer]);
                        } catch (_) {
                            await deliver({ type: 'offline' });
                        } finally {
                            clearTimeout(timeout);
                        }
                        await sleep(Math.max(0, POLL_MS - (performance.now() - started)));
                    }
                }
                poll();
            `;

            const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
            const worker = new Worker(url);
            URL.revokeObjectURL(url);
            const updateVisibility = () => worker.postMessage({ active: !document.hidden });
            document.addEventListener('visibilitychange', updateVisibility);
            updateVisibility();
            worker.onmessage = event => {
                try {
                    if (event.data.type === 'ram') acceptRAM(new Uint8Array(event.data.buffer));
                    else demoFrame();
                } finally {
                    worker.postMessage({ ack: true });
                }
            };
            window.addEventListener('beforeunload', () => worker.terminate(), { once: true });
            return worker;
        }

        async function startMainThreadPolling() {
            for (;;) {
                if (document.hidden) { await new Promise(resolve => setTimeout(resolve, 250)); continue; }
                const started = performance.now();
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 1000);
                try {
                    const response = await fetch(RAM_URL, { cache: 'no-store', signal: controller.signal });
                    if (!response.ok) throw new Error('fetch failed');
                    const buffer = await response.arrayBuffer();
                    if (buffer.byteLength !== 131072) throw new Error('invalid WRAM size');
                    acceptRAM(new Uint8Array(buffer));
                } catch (_) {
                    demoFrame();
                } finally {
                    clearTimeout(timeout);
                }
                await new Promise(resolve => setTimeout(resolve, Math.max(0, POLL_MS - (performance.now() - started))));
            }
        }

        canvas.oncontextmenu = event => {
            event.preventDefault();
            menu.style.display = 'block';
            menu.style.left = Math.min(event.pageX, window.innerWidth - 200) + 'px';
            menu.style.top = Math.min(event.pageY, window.innerHeight - 150) + 'px';
        };
        document.onclick = () => menu.style.display = 'none';

        function populateMenu(id, options, key, labels) {
            const ul = document.getElementById(id);
            options.forEach((option, index) => {
                const li = document.createElement('li');
                li.textContent = (state[key] === index ? '● ' : '○ ') + option;
                li.onclick = () => {
                    if (state[key] === index) return;
                    state[key] = index;
                    saveState();
                    if (labels) viewLabel.textContent = labels[index];
                    if (key === 'colorMode') rebuildColorCache();
                    ul.innerHTML = '';
                    populateMenu(id, options, key, labels);
                    requestDraw();
                };
                ul.appendChild(li);
            });
        }

        const viewOptions = ['WRAM (128KB)', 'VRAM (64KB)', 'SRAM (32KB)'];
        const viewLabels = ['WRAM 128KB', 'VRAM 64KB', 'SRAM 32KB'];
        populateMenu('viewMenu', viewOptions, 'view', viewLabels);
        populateMenu('effectMenu', ['None', 'Glow', 'Particles', 'Wave'], 'effectMode');
        populateMenu('colorMenu', ['Region-Based', 'Classic Purple', 'Activity Heatmap', 'Rainbow'], 'colorMode');
        viewLabel.textContent = viewLabels[state.view] || viewLabels[0];

        rebuildRegionBands();
        rebuildColorCache();
        resize();
        window.onresize = () => {
            if (resizeQueued) return;
            resizeQueued = true;
            requestAnimationFrame(() => {
                resizeQueued = false;
                resize();
            });
        };

        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 32px system-ui';
        ctx.fillStyle = '#6366f1';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#6366f1';
        ctx.shadowBlur = 20;
        ctx.fillText('SNES9X-FastLink', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '16px system-ui';
        ctx.fillStyle = '#888';
        ctx.shadowBlur = 0;
        ctx.fillText('Connecting to emulator...', canvas.width / 2, canvas.height / 2 + 20);
        needsDraw = false;

        try { startWorkerPolling(); } catch (_) { startMainThreadPolling(); }
    })();
    </script>
</body>
</html>
