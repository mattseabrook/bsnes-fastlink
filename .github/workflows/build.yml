name: Windows x64 Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Uses the same installed MSVC/Windows/Vulkan SDK cross toolchain as build.sh.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Build native Windows application
        run: ./build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: bsnes-windows-x64
          path: build_win/bsnes.exe
